<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F150F" />
    <meta name="description" content="Daftar — the journal you actually own." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Daftar</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('daftar.theme');
        document.documentElement.dataset.theme = t === 'daylight' ? 'daylight' : 'lamplight';
        document.documentElement.dataset.write = localStorage.getItem('daftar.writing') === 'hand' ? 'hand' : 'book';
      } catch (e) { document.documentElement.dataset.theme = 'lamplight'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
