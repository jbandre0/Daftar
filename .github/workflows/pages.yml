# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions"; Settings -> Secrets and variables -> Actions ->
#   secrets VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY (the same two values as app/.env.local).
# Optional repository VARIABLES (not secrets): PAGES_BASE (default: "/<repo name>/", or "/" for a custom domain or a *.github.io repo)
#   and VITE_CHECKOUT_URL (leave unset until you sell).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Tests (a failing test stops the deploy)
        # The tests never reach a server, but the Supabase client refuses to load without these two values, so give it placeholders.
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-for-tests
        run: npm test
      - name: Build
        env:
          VITE_BASE: ${{ vars.PAGES_BASE || (endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name)) }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CHECKOUT_URL: ${{ vars.VITE_CHECKOUT_URL }}
        run: npm run build
      # Pages can't rewrite every address to index.html, so a refresh on /write would 404.
      # Serving the same page as 404.html lets the app load and its router take over.
      - name: Single-page-app fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
